name: Smoke production

# Layer 3 of the regression-testing standard (brain/docs/regression-testing.md):
# a standing smoke suite runs AUTOMATICALLY against the live site after every
# production deploy.
#
# hellokahwin has no deploy workflow of its own: Vercel's Git integration
# deploys every push to master. Vercel reports each deployment back to GitHub
# as a deployment + deployment_status (creator vercel[bot], environment
# "Production"), so this workflow is the "last job of the deploy": it fires
# when that status turns `success`.
#
# It tests https://hellokahwin.com, not the deployment's own *.vercel.app URL:
# those are behind Vercel Deployment Protection (302 to vercel.com/sso-api) and
# a bypass would need a new secret.
#
# Red does NOT roll back. It means "production is live and something on it
# looks wrong". The run goes red, AND the last step opens (or comments on) an
# issue titled "Live-site smoke check failed": a deployment_status run is
# started by vercel[bot], so GitHub's own "your workflow failed" email goes to
# nobody, while a new issue emails the repo's watchers (the owner by default).
# Close the issue once production is fixed; the next red run opens a new one.
#
# Read-only, no fixtures, no secrets — see the header of scripts/smoke-prod.mjs.

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke-production
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke — live site (hellokahwin.com)
    # Expression string comparisons are case-insensitive, and startsWith also
    # admits Vercel's per-project form ("Production – hellokahwin"). Preview
    # deployments are skipped. The value observed on 2026-11-04 is "Production".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    # Pinned, not ubuntu-latest: the last check drives the runner's own Google
    # Chrome, and 24.04 is the image known to ship it (ubuntu-latest moved to
    # 26.04 on 2026-11-04).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SMOKE_BASE_URL: https://hellokahwin.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: the suite uses only Node built-ins (fetch, node:test).
      #
      # Vercel can report `success` a moment before the hellokahwin.com alias
      # and the edge cache have moved to the new build. One retry after a
      # minute absorbs that; a real breakage fails both runs and the job goes
      # red. The first run's failures are still printed in the log.
      - name: Run smoke suite
        run: |
          if node --test scripts/smoke-prod.mjs; then exit 0; fi
          echo "::warning::smoke failed once; retrying in 60s in case the alias had not switched yet"
          sleep 60
          node --test scripts/smoke-prod.mjs

      - name: Raise an issue when the live site looks wrong
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Live-site smoke check failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.deployment?.sha ?? context.sha;
            const body = [
              `The post-deploy smoke suite failed against https://hellokahwin.com (commit ${sha}).`,
              `Run log (which checks failed, and why): ${run}`,
              'Nothing was rolled back. Re-run by hand: `node --test scripts/smoke-prod.mjs`.',
            ].join('\n\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
