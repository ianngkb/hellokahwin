name: UI layout gate

# The rendered-layout gate. See `scripts/ui-layout-gate.mjs` for the checks and
# the reasoning behind each threshold — the file's own header is the list that
# is kept current, and it is eleven now: UI-10 added the reading measure on
# 31 Ogos 2026, and UI-13 added H6 (homepage category diversity) and H6.6
# (source order) on 01 Sept 2026. Those last two are the first checks here that
# enforce an EDITORIAL rule rather than a rendering one, and they are here for
# the same reason as everything else: the defect was invisible to every
# structural check and completely obvious to a reader.
#
# WHY THIS EXISTS. On 31 Aug 2026 every one of the twelve cards on the front page
# rendered its headline in a 44-pixel column, and every automated check this repo
# owns was green while it happened, because every one of them compares structure:
# the DOM was valid, the HTML diffed clean, nothing threw. Sprint 03's own
# retrospective had already written down that nothing here looks at a computed
# value. Prose in a retro did not stop it. This is the thing that looks.
#
# THREE JOBS, ON PURPOSE.
#
#   selftest    Blocking, on every push and PR. Hermetic apart from the fixture
#               images. It does not check the site — it checks the GATE, against
#               a committed capture of the broken production HTML and a
#               hand-built discriminator fixture, asserting that each check
#               fires where the defect is and clears where it is not. A gate
#               nobody has seen fail is not a gate, and a gate that has quietly
#               started passing everything looks exactly like a healthy one.
#
#   h6-selection
#               Blocking, on every push and PR. The one job here that tests the
#               SITE rather than an instrument, and the only one that can catch a
#               pull request re-introducing UI-13's defect. Separate from
#               `selftest` because that job's `npm i --no-save` leaves an
#               npm-shaped node_modules that `pnpm install --frozen-lockfile`
#               refuses to reuse.
#
#   production  Scheduled and manual, never blocking a PR. Runs every check
#               against the four widths of every public template on the live
#               site and files a loud issue when they fail. It is deliberately
#               NOT a required check: six agents were merging in parallel when
#               this landed, and a required check that is red for a defect none
#               of their PRs touch stops the work that would fix it.
#
# A scheduled workflow only runs from the repository's DEFAULT branch. On a
# feature branch this file is decorative — the same trap that cost a reopen in
# Sprint 01. Confirm with `gh workflow list` after merging.
#
# playwright-core is installed here with `npm i --no-save` rather than added to
# package.json. The lockfile is shared by every concurrent worktree and a
# dependency bump is the most conflict-prone line in the repo; the browser
# binary is Chrome, already on the runner image, so nothing else is needed.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 01:07 UTC daily = 09:07 MYT. Off the hour: the top of the hour is when
    # GitHub's scheduler is most congested.
    - cron: '7 1 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to gate (defaults to production)'
        required: false
        default: 'https://hellokahwin.com'

permissions:
  contents: read
  issues: write

env:
  PLAYWRIGHT_CORE_VERSION: '1.58.2'

jobs:
  selftest:
    name: gate self-test (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright-core
        run: npm i --no-save playwright-core@${{ env.PLAYWRIGHT_CORE_VERSION }}

      - name: Locate Chrome
        id: chrome
        run: |
          which google-chrome || which google-chrome-stable || which chromium-browser
          echo "path=$(which google-chrome || which google-chrome-stable || which chromium-browser)" >> "$GITHUB_OUTPUT"

      # Needs outbound access to images.hellokahwin.com: one of the assertions
      # is that all 13 homepage images DECODE, which is what proves the
      # naturalWidth-0 exclusion is not quietly hiding a real defect.
      # `set -o pipefail` is load-bearing, not tidiness. Without it the step's
      # exit status is `tee`'s, which is always 0, and this job reported SUCCESS
      # on its very first run while the gate printed `UILINT EXIT: 1` and one
      # assertion failed. A blocking check that cannot fail is worse than none:
      # it is a green tick that means nothing, which is the exact shape of the
      # problem this whole item exists to fix.
      - name: Does the gate fire on known-bad and clear on known-good?
        env:
          UI_GATE_CHROME: ${{ steps.chrome.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/ui-layout-gate.mjs --selftest | tee gate.log

      # UI-13. The SECOND implementation of H6 (DES-03 §7.5), over raw HTML
      # rather than the rendered DOM. Checks 10 and 11 above are the browser's
      # version and the self-test already asserts the two agree on the extracted
      # sequence; this step is what stops the shell instrument itself rotting
      # unnoticed, and it is the DoD's negative control run in CI rather than
      # pasted into a document once.
      #
      # Hermetic on purpose — committed files, no network — so it belongs in the
      # BLOCKING job. It is not a check of the live homepage; the production job
      # below does that, through `--base`, which now carries H6 with it.
      #
      # A CRLF checkout would make this "bad interpreter" rather than a failure,
      # so `scripts/**/*.sh text eol=lf` is pinned in .gitattributes.
      #
      # ⚠ `set +e` IS LOAD-BEARING AND IT IS THE FIRST LINE FOR A REASON.
      # `shell: bash` runs `bash --noprofile --norc -e -o pipefail`, and `-e` is
      # fatal to a suite whose FIRST control expects a non-zero exit: the shell
      # dies inside `run` on `check-h6.sh`'s expected `1`, before `got=$?` is
      # ever read. Measured, run 33431747618 on 31 Aug 2026 — the step printed
      # its header line, nothing else, and exited 1. It looked like a failing
      # negative control and it was a step that could not run at all. `set -uo
      # pipefail` does NOT clear `-e`, which is why this reads `+e` explicitly.
      # Locally the same script passes, because a plain `bash file.sh` has no
      # `-e`; that difference is the whole trap.
      #
      # `ran` is the second half of the defence. A suite that dies early prints
      # some passes and then stops, which reads exactly like a suite that
      # finished — so the count is asserted at the end and the step fails if any
      # control did not execute.
      - name: Does check-h6.sh reject the known-bad homepage and accept the known-good one?
        shell: bash
        run: |
          set +e
          set -uo pipefail
          rc=0
          ran=0
          run() { # run <expected-exit> <file>
            bash scripts/measure/check-h6.sh "$2" > h6.out 2>&1
            got=$?
            ran=$((ran + 1))
            if [ "$got" = "$1" ]; then
              echo "  ok   exit $got (expected $1)  $2"
            else
              echo "  FAIL exit $got (expected $1)  $2"; sed 's/^/       /' h6.out; rc=1
            fi
          }
          echo 'check-h6.sh — DES-03 §7.5, over raw HTML'
          # The negative control: the CEO's 31 Aug capture of the real front
          # page, 13 items and every one of them hantaran-mas-kahwin.
          run 1 tests/ui-layout-gate/fixtures/2026-08-31-pre-ui-fix/homepage.html
          # The positive control. Both H6.6 fixtures must exit 0 here: their
          # item sets are identical and the reversal is CSS, which this script
          # is structurally blind to. That blindness is the reason check 11
          # exists in the browser gate, and asserting it keeps the division of
          # labour between the two instruments honest rather than assumed.
          run 0 tests/ui-layout-gate/fixtures/h6-order-good.html
          run 0 tests/ui-layout-gate/fixtures/h6-order-reversed.html
          # A fetch or usage error is exit 3 and is NOT a verdict about a page.
          run 3 tests/ui-layout-gate/fixtures/no-such-file.html
          if [ "$ran" != "4" ]; then
            echo "  FAIL only $ran of 4 controls executed — the suite did not finish,"
            echo "       which prints exactly like a suite that did. Check the shell flags."
            rc=1
          fi
          echo "  $ran of 4 controls ran"
          exit $rc

      - name: Summary
        if: always()
        run: |
          {
            echo '### UI layout gate — self-test'
            echo ''
            echo '```'
            tail -n 60 gate.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # UI-13, and this is the job that makes the item's DoD literally true — "a
  # future regression fails a build rather than waiting for a board meeting."
  #
  # The `selftest` job above gates the INSTRUMENTS. Neither of its two steps can
  # see a regression in the thing being measured, because both are hermetic and
  # the homepage needs a database. The THIRD implementation of H6 is
  # `src/lib/inspire/home-selection.ts` — H6.4's rank and greedy slot fill,
  # H6.5's relaxation ladder — and it is the only one a pull request can break.
  # Re-narrowing the candidate pool back to a recency window is a one-word change
  # (`.limit(20)`) that restores the exact defect this item fixed, and until this
  # job existed nothing in CI ran a test at all: this repo has four gate
  # workflows and no lint or test workflow.
  #
  # A SEPARATE JOB, not a step in `selftest`, and that is a correctness point
  # rather than tidiness. `selftest` installs playwright-core with
  # `npm i --no-save`, which leaves an npm-shaped `node_modules`; a later
  # `pnpm install --frozen-lockfile` in the same job refuses to work with a
  # modules directory another package manager created. Two jobs, two clean
  # checkouts, and they run in parallel.
  #
  # SCOPED TO ONE TEST FILE ON PURPOSE. Running the whole suite would quietly
  # make the layout gate into the repo's test job, which is a decision for
  # whoever owns CI and not one to take sideways inside a design item. That gap
  # is a real open finding, with its owner named in this item's work-done entry.
  h6-selection:
    name: H6 selection unit tests (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `version: 10` is not a preference: package.json carries no
      # `packageManager` field, so `pnpm/action-setup` has nothing to resolve
      # from and fails the step outright. Same block as `article-toc-gate.yml`,
      # copied rather than improvised so the two cannot drift.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Does the H6 selection still hold? (H6.4 rank, H6.5 ladder, determinism)
        run: pnpm exec vitest run src/lib/inspire/__tests__/home-selection.test.ts

  production:
    name: gate the live site (scheduled)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright-core
        run: npm i --no-save playwright-core@${{ env.PLAYWRIGHT_CORE_VERSION }}

      - name: Locate Chrome
        id: chrome
        run: echo "path=$(which google-chrome || which google-chrome-stable || which chromium-browser)" >> "$GITHUB_OUTPUT"

      - name: Gate every public template at 390/768/1024/1440
        env:
          UI_GATE_CHROME: ${{ steps.chrome.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/ui-layout-gate.mjs \
            --base "${{ github.event.inputs.base_url || 'https://hellokahwin.com' }}" \
            --json gate.json | tee gate.log

      - name: Summary
        if: always()
        run: |
          {
            echo '### UI layout gate — live site'
            echo ''
            echo '```'
            tail -n 80 gate.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-layout-gate
          path: |
            gate.log
            gate.json
          if-no-files-found: warn

      - name: Raise the alarm
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let tail = '';
            try {
              tail = fs.readFileSync('gate.log', 'utf8').split('\n').slice(-45).join('\n');
            } catch {}
            const body = [
              '**The live site is failing the rendered-layout gate.**',
              '',
              'These are computed values read out of a real browser at 390/768/1024/1440,',
              'not a structural diff. A page can be valid HTML, diff clean and throw no',
              'error while looking broken; that is precisely how the 44px headline column',
              'reached the front page on 31 Aug 2026.',
              '',
              '```',
              tail,
              '```',
              '',
              `Run: ${url}`,
              '',
              'Reproduce locally:',
              '`node scripts/ui-layout-gate.mjs --base https://hellokahwin.com`',
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ui-layout-gate',
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'ALARM: hellokahwin.com is failing the rendered-layout gate',
                body,
                labels: ['ui-layout-gate'],
              });
            }
