# pnpm settings. NOT a monorepo declaration — there is no `packages:` key, so
# this repo stays a single project.
#
# ── WHY THIS FILE EXISTS (02 Sept 2026) ───────────────────────────────────
#
# ⚠ READ THE CORRECTION AT THE BOTTOM OF THIS BLOCK BEFORE QUOTING ANY OF IT.
#
# One production build — and so far ONLY one — was handed a pnpm 11.x builder
# by Vercel, and failed. `0f2a4c9`, 19:27 UTC, 02 Sept 2026:
#
#   19:17  0129797  "Using pnpm@10.x based on project creation date"
#                   "Ignored build scripts: msw@2.15.0"        <- a WARNING
#                   "Done in 2.1s using pnpm v10.28.0"         -> SUCCESS
#
#   19:27  0f2a4c9  "Using pnpm@11.x based on project creation date"
#                   "[ERR_PNPM_IGNORED_BUILDS] Ignored build scripts:
#                    esbuild@0.18.20, esbuild@0.25.12, esbuild@0.28.2,
#                    msw@2.15.0, sharp@0.34.5, unrs-resolver@1.12.2"
#                   'Command "pnpm install" exited with 1'     -> FAILURE
#
# ── THE CORRECTION, AND IT IS THE MORE USEFUL HALF ────────────────────────
#
# The first version of this comment said Vercel had "rolled its default pnpm
# from 10.x to 11.x" and that "every production deploy of this repo started
# failing". BOTH ARE WRONG, and this file's own author wrote them after
# watching exactly one failure and one subsequent success.
#
# The pnpm version was then read out of the build log of all EIGHT most recent
# production builds:
#
#   07fd6421  READY  pnpm@10.x  v10.28.0
#   9c1ca0c2  READY  pnpm@10.x  v10.28.0   <- the deploy of THIS file
#   5c18c742  READY  pnpm@10.x  v10.28.0
#   0f2a4c99  ERROR  pnpm@11.x             <- the only 11.x build that exists
#   0129797a  READY  pnpm@10.x  v10.28.0
#   5342703c  READY  pnpm@10.x  v10.28.0
#   59954c65  READY  pnpm@10.x  v10.28.0
#   eaad6d33  READY  pnpm@10.x  v10.28.0
#
# It was not a rollout. It was ONE BUILD landing on an 11.x builder, before and
# after which selection returned to 10.28.0. Which means:
#
#   **THIS FILE DID NOT UNBLOCK THE DEPLOY.** The build that carried it
#   (`9c1ca0c2`) succeeded on pnpm 10.28.0 and would have succeeded without it.
#   A single green deploy after a fix is not evidence the fix did anything —
#   the variable moved back on its own.
#
# What this file IS, then, is the defence for the NEXT time an 11.x builder is
# selected, which can happen on any deploy, from any branch, with no change
# from anyone here. That part is measured (below) rather than inferred.
#
# THREE things changed at once, and the third is the one that bites.
#
#  1. pnpm 11 makes an ignored build script a HARD ERROR, not a warning.
#
#  2. pnpm 11 NO LONGER READS THE `pnpm` FIELD IN `package.json`. Reproduced
#     locally with `npx pnpm@11 install --frozen-lockfile`, which says so:
#
#       [WARN] The "pnpm" field in package.json is no longer read by pnpm.
#       The following keys were ignored: "pnpm.onlyBuiltDependencies".
#
#     That is why `sharp`, `esbuild` and `unrs-resolver` are in the error list
#     at all — they were already allow-listed in `package.json`, and the
#     allow-list stopped being read.
#
#  3. THE SETTING IS ALSO RENAMED. `onlyBuiltDependencies` — a LIST — became
#     `allowBuilds`, a MAP of package to boolean. Moving the old key into this
#     file verbatim does NOT work, and it fails with the byte-identical error,
#     which is exactly what it looks like when a fix has changed nothing.
#     Caught only by running the fix against the failing case: pnpm rewrote
#     this file itself and prepended
#
#       allowBuilds:
#         esbuild: set this to true or false
#
#     which is the whole answer, and is not visible from the error message.
#
# `sharp` is the entry that matters. `next.config.ts` lists it in
# `serverExternalPackages` and it does the site's image processing; a sharp
# without its platform binaries is a broken build, not a slow one.
#
# `msw` was NOT in the `package.json` list — it is the package that produced
# the warning under pnpm 10 for however long that was true.
#
# The `pnpm` field in `package.json` is deliberately LEFT IN PLACE: pnpm 10
# still reads it and does not read this file, and local machines are on 10.x
# (10.30.1 at time of writing). Keep the two in step. When every consumer is on
# 11.x, delete the `package.json` field, not this file.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
